<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동물 얼굴 운동</title>
<meta name="description" content="오리·라마·개미핥기·하마·복어·쿼카·소. 손 안 대고 하는 얼굴·목 운동 음성 가이드와 운동 기록.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 한 줄 세로 흐름: 오늘 요약 → 루틴 목록 → 기록. 재생 중에는 아래에 플레이어 고정 */
:root {
  --bg: #EDF1F4; --surface: #FFFFFF; --ink: #18222D; --muted: #5B6976; --line: #D5DDE3;
  --accent: #C2405A; --accent-ink: #FFFFFF; --done: #23805D;
  --h0: #DDE4E9; --h1: #F1C2CB; --h2: #E07B91; --h3: #B5354F;
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11171D; --surface: #1A222A; --ink: #E5EBF0; --muted: #93A1AD; --line: #2A3540;
    --accent: #EE7189; --accent-ink: #1A0E12; --done: #5CC49A;
    --h0: #232D36; --h1: #5A2A35; --h2: #9C4458; --h3: #EE7189;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--body); }
button { font: inherit; color: inherit; }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }

.wrap {
  max-width: 560px; margin: 0 auto; padding-inline: 16px;
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) 180px;
  display: grid; gap: 32px;
}
.eyebrow { margin: 0 0 2px; color: var(--muted); font-size: 13px; letter-spacing: .04em; }
h1 { font-size: 40px; line-height: 1.1; }
h2 { font-size: 24px; line-height: 1.2; }
.sec { display: grid; gap: 12px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); font-size: 13px; }

/* 오늘 요약 */
.stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
}
.stat { padding: 14px 12px; display: grid; gap: 2px; min-width: 0; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat b { font: 30px/1 var(--display); font-weight: 400; font-variant-numeric: tabular-nums; }
.stat b small { font-size: 15px; margin-left: 2px; color: var(--muted); }
.stat span { font-size: 12px; color: var(--muted); }
@media (max-width: 440px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .stat:nth-child(3) { border-left: 0; }
  .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
}

/* 버튼 */
.primary {
  border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
  font: 20px/1 var(--display); padding: 16px; cursor: pointer; width: 100%;
}
.primary:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 운동 목록 */
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.item.is-current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.row {
  all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
  display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 14px 16px; border-radius: 14px;
}
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font: 20px var(--display); color: var(--muted); }
.animal { font: 24px/1.15 var(--display); display: block; }
.action { color: var(--muted); font-size: 14px; display: block; }
.meta { display: grid; justify-items: end; gap: 2px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.check { color: var(--done); font-weight: 600; font-size: 12px; }
.intro { margin: 0; padding: 0 16px 16px calc(1.6em + 28px); font-size: 14px; }
.err { padding: 16px; color: var(--muted); }

/* 기록: 히트맵 */
.heat {
  display: grid; grid-template-columns: 1.6em repeat(8, minmax(0, 34px));
  gap: 4px; font-size: 11px; color: var(--muted);
}
.heat .lbl { align-self: center; white-space: nowrap; }
.cell { aspect-ratio: 1; border-radius: 4px; background: var(--h0); max-width: 100%; }
.cell.l1 { background: var(--h1); } .cell.l2 { background: var(--h2); } .cell.l3 { background: var(--h3); }
.cell.future { background: transparent; }
.cell.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

/* 기록: 날짜별 목록 */
.days { display: grid; gap: 16px; }
.day h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.day h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.day ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.day li {
  display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto auto; gap: 10px; align-items: center;
  padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums;
}
.day .time { color: var(--muted); }
.chip { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; border: 1px solid currentColor; }
.chip.done { color: var(--done); }
.chip.part { color: var(--muted); }
.empty { margin: 0; color: var(--muted); font-size: 14px; }

/* 하단 플레이어 */
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 24px rgb(0 0 0 / .08);
}
.player-in { max-width: 528px; margin: 0 auto; display: grid; gap: 6px; }
.p-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.p-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-title b { font: 20px var(--display); font-weight: 400; margin-right: 6px; }
.p-title span { color: var(--muted); font-size: 13px; }
.p-time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
#seek { width: 100%; accent-color: var(--accent); margin: 0; }
.p-ctl { display: flex; justify-content: center; align-items: center; gap: 20px; }
.icon {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: transparent; display: grid; place-items: center; cursor: pointer;
}
.icon.big { width: 54px; height: 54px; background: var(--accent); color: var(--accent-ink); border: 0; }
.icon:disabled { opacity: .35; cursor: default; }
.icon svg { width: 20px; height: 20px; fill: currentColor; }
.p-mode { font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <p class="eyebrow">손 안 대고 하는 얼굴·목 운동</p>
    <h1>동물 얼굴 운동</h1>
  </header>

  <section class="sec" aria-labelledby="h-today">
    <h2 id="h-today" hidden>오늘 요약</h2>
    <div class="stats">
      <div class="stat"><b id="sToday">0<small>분</small></b><span>오늘 운동</span></div>
      <div class="stat"><b id="sDone">0<small>/7</small></b><span>오늘 완료</span></div>
      <div class="stat"><b id="sStreak">0<small>일</small></b><span>연속 운동</span></div>
      <div class="stat"><b id="sWeek">0<small>분</small></b><span>이번 주</span></div>
    </div>
  </section>

  <section class="sec" aria-labelledby="h-routine">
    <div class="sec-head"><h2 id="h-routine">루틴</h2><span id="total" class="muted"></span></div>
    <button id="playAll" class="primary" disabled>전체 루틴 시작</button>
    <ol id="list" class="list"></ol>
  </section>

  <section class="sec" aria-labelledby="h-log">
    <div class="sec-head"><h2 id="h-log">운동 기록</h2><span class="muted">이 기기 브라우저에 저장됩니다</span></div>
    <div id="heat" class="heat" role="img" aria-label="최근 8주 운동 달력"></div>
    <div class="legend">
      <span><i style="background:var(--h0)"></i>안 함</span>
      <span><i style="background:var(--h1)"></i>5분 미만</span>
      <span><i style="background:var(--h2)"></i>10분 미만</span>
      <span><i style="background:var(--h3)"></i>10분 이상</span>
    </div>
    <div id="days" class="days"></div>
    <p id="empty" class="empty">아직 기록이 없어요. 운동을 재생하면 자동으로 기록됩니다. 80% 이상 들으면 '완료', 10초 이상 들으면 '중단'으로 남아요.</p>
  </section>
</main>

<div id="player" class="player" hidden>
  <div class="player-in">
    <div class="p-top">
      <div class="p-title"><b id="pAnimal"></b><span id="pAction"></span></div>
      <span id="pTime" class="p-time">0:00 / 0:00</span>
    </div>
    <input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="재생 위치">
    <div class="p-ctl">
      <button id="prev" class="icon" aria-label="이전 운동"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="toggle" class="icon big" aria-label="재생"></button>
      <button id="next" class="icon" aria-label="다음 운동"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <div id="pMode" class="p-mode"></div>
  </div>
</div>

<script>
const LOG_KEY = 'face-ex-log-v1', PENDING_KEY = 'face-ex-pending-v1';
const MIN_SEC = 10;      // 이보다 짧게 들은 건 기록하지 않음
const DONE_RATIO = 0.8;  // 이만큼 들어야 '완료'
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
const WEEKDAY = ['일', '월', '화', '수', '목', '금', '토'];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${x.getMonth() + 1}-${x.getDate()}`; };
const clock = s => { s = Math.floor(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const human = s => s < 60 ? `${Math.round(s)}초` : `${Math.floor(s / 60)}분` + (Math.round(s % 60) ? ` ${Math.round(s % 60)}초` : '');
// 큰 숫자 칸: 1분 미만이면 초로
const bigNum = s => s > 0 && s < 60 ? [Math.round(s), '초'] : [Math.round(s / 60), '분'];

let ex = [];                       // routine.json의 운동 목록
let log = load(LOG_KEY, []);       // [{t: 시작 ms, id, sec, done}]
let cur = -1, routine = false;     // 현재 운동, 전체 루틴 모드 여부
let session = null, lastPos = 0, lastSaved = 0;
const audio = new Audio();
audio.preload = 'auto';

// 지난번에 탭을 닫아 마무리 못 한 기록
const leftover = load(PENDING_KEY, null);
if (leftover) {
  if (leftover.sec >= MIN_SEC) { log.push({ ...leftover, sec: Math.round(leftover.sec), done: false }); save(LOG_KEY, log); }
  save(PENDING_KEY, null);
}

fetch('routine.json').then(r => r.json()).then(r => {
  ex = r.exercises.map((e, i) => {
    const [animal, action] = e.name.split(' - ');
    const reps = [e, ...(e.parts || [])].reduce((a, p) => a + (p.repetitions || 0), 0);
    // build_guide.py와 같은 파일명 규칙: "01 오리 - ….mp3"
    const src = 'guides/' + encodeURIComponent(`${String(i + 1).padStart(2, '0')} ${e.name}.mp3`);
    return { id: e.id, animal, action, intro: e.intro, reps, src, dur: 0 };
  });
  ex.forEach(e => {
    const a = new Audio();
    a.preload = 'metadata';
    a.onloadedmetadata = () => { e.dur = a.duration; renderList(); };
    a.src = e.src;
  });
  $('#playAll').disabled = false;
  renderList(); renderStats();
}).catch(() => {
  $('#list').innerHTML = '<li class="err">운동 목록을 불러오지 못했어요. 새로고침해 주세요.</li>';
});

function play(i, all) {
  if (i < 0 || i >= ex.length) return;
  finish(false);
  routine = all; cur = i;
  audio.src = ex[i].src;
  audio.play().catch(() => {});
  session = { t: Date.now(), id: ex[i].id, sec: 0 };
  lastPos = 0;
  $('#player').hidden = false;
  renderList(); renderPlayer();
}

// 현재 세션을 기록으로 옮긴다. ended=true면 끝까지 재생된 경우
function finish(ended) {
  if (!session) return;
  const s = session;
  session = null;
  save(PENDING_KEY, null);
  const done = ended && s.sec >= audio.duration * DONE_RATIO;
  if (done || s.sec >= MIN_SEC) {
    log.push({ t: s.t, id: s.id, sec: Math.round(s.sec), done });
    save(LOG_KEY, log);
    renderStats(); renderList();
  }
}

function toggle() {
  if (cur < 0) return;
  if (!session) return play(cur, routine);   // 끝난 운동 다시 듣기
  audio.paused ? audio.play().catch(() => {}) : audio.pause();
}

audio.addEventListener('timeupdate', () => {
  const t = audio.currentTime, d = t - lastPos;
  lastPos = t;
  if (session && !audio.paused && d > 0 && d < 5) {  // 건너뛴 구간은 안 셈
    session.sec += d;
    if (Date.now() - lastSaved > 5000) { save(PENDING_KEY, session); lastSaved = Date.now(); }
  }
  renderProgress();
});
audio.addEventListener('seeked', () => { lastPos = audio.currentTime; });
audio.addEventListener('loadedmetadata', renderProgress);
audio.addEventListener('play', renderPlayer);
audio.addEventListener('pause', () => { if (session) save(PENDING_KEY, session); renderPlayer(); });
audio.addEventListener('ended', () => {
  finish(true);
  if (routine && cur < ex.length - 1) play(cur + 1, true);
  else { routine = false; renderPlayer(); }
});
addEventListener('pagehide', () => { if (session) save(PENDING_KEY, session); });

$('#playAll').onclick = () => play(0, true);
$('#toggle').onclick = toggle;
$('#prev').onclick = () => play(cur - 1, routine);
$('#next').onclick = () => play(cur + 1, routine);
$('#seek').oninput = e => { audio.currentTime = +e.target.value; };
$('#list').onclick = e => {
  const b = e.target.closest('.row');
  if (!b) return;
  const i = +b.dataset.i;
  i === cur && session ? toggle() : play(i, false);
};

function doneToday() {
  const today = dayKey(Date.now());
  return new Set(log.filter(l => l.done && dayKey(l.t) === today).map(l => l.id));
}

function renderList() {
  if (!ex.length) return;
  const done = doneToday();
  const total = ex.reduce((a, e) => a + e.dur, 0);
  $('#total').textContent = `${ex.length}가지` + (ex.every(e => e.dur) ? ` · 약 ${Math.round(total / 60)}분` : '');
  $('#list').innerHTML = ex.map((e, i) => `
    <li class="item${i === cur ? ' is-current' : ''}">
      <button class="row" data-i="${i}" aria-label="${esc(e.animal)} 운동 재생">
        <span class="num">${i + 1}</span>
        <span><b class="animal">${esc(e.animal)}</b><span class="action">${esc(e.action)}</span></span>
        <span class="meta"><span>${e.reps}회 · ${e.dur ? clock(e.dur) : '–'}</span>${done.has(e.id) ? '<span class="check">✓ 오늘 완료</span>' : ''}</span>
      </button>
      ${i === cur ? `<p class="intro">${esc(e.intro)}</p>` : ''}
    </li>`).join('');
}

function renderPlayer() {
  if (cur < 0) return;
  const e = ex[cur];
  $('#pAnimal').textContent = e.animal;
  $('#pAction').textContent = e.action;
  const playing = session && !audio.paused;
  $('#toggle').innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
  $('#toggle').setAttribute('aria-label', playing ? '일시정지' : '재생');
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === ex.length - 1;
  $('#pMode').textContent = routine ? `전체 루틴 ${cur + 1} / ${ex.length}` : (session ? '' : '끝났어요. 다시 들으려면 재생을 누르세요.');
  renderProgress();
}

function renderProgress() {
  const d = audio.duration || 0;
  $('#seek').max = d || 1;
  $('#seek').value = audio.currentTime;
  $('#pTime').textContent = `${clock(audio.currentTime)} / ${clock(d)}`;
}

function setBig(el, sec) {
  const [n, unit] = bigNum(sec);
  el.innerHTML = `${n}<small>${unit}</small>`;
}

function renderStats() {
  const now = new Date(), today = dayKey(now);
  const byDay = {};
  log.forEach(l => { const k = dayKey(l.t); byDay[k] = (byDay[k] || 0) + l.sec; });

  setBig($('#sToday'), byDay[today] || 0);
  $('#sDone').innerHTML = `${doneToday().size}<small>/${ex.length || 7}</small>`;

  // 연속 운동일: 오늘 아직 안 했으면 어제부터 센다
  let streak = 0;
  const d = new Date(now);
  if (!byDay[today]) d.setDate(d.getDate() - 1);
  while (byDay[dayKey(d)]) { streak++; d.setDate(d.getDate() - 1); }
  $('#sStreak').innerHTML = `${streak}<small>일</small>`;

  const monday = new Date(now);
  monday.setHours(0, 0, 0, 0);
  monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7);
  setBig($('#sWeek'), log.filter(l => l.t >= monday.getTime()).reduce((a, l) => a + l.sec, 0));

  renderHeat(byDay, monday, today);
  renderDays();
}

// 최근 8주. 열 = 주(월요일 시작), 행 = 요일
function renderHeat(byDay, monday, today) {
  const start = new Date(monday);
  start.setDate(start.getDate() - 7 * 7);
  const dateAt = (w, r) => { const x = new Date(start); x.setDate(x.getDate() + w * 7 + r); return x; };
  let html = '<span></span>';
  for (let w = 0; w < 8; w++) {
    const days = [...Array(7)].map((_, r) => dateAt(w, r));
    const first = days.find(x => x.getDate() === 1);
    html += `<span class="lbl">${w === 0 ? dateAt(0, 0).getMonth() + 1 + '월' : first ? first.getMonth() + 1 + '월' : ''}</span>`;
  }
  for (let r = 0; r < 7; r++) {
    html += `<span class="lbl">${WEEKDAY[(r + 1) % 7]}</span>`;
    for (let w = 0; w < 8; w++) {
      const x = dateAt(w, r), k = dayKey(x), sec = byDay[k] || 0;
      if (x > new Date() && k !== today) { html += '<span class="cell future"></span>'; continue; }
      const lv = sec === 0 ? 0 : sec < 300 ? 1 : sec < 600 ? 2 : 3;
      const tip = `${x.getMonth() + 1}월 ${x.getDate()}일 · ${sec ? human(sec) : '운동 안 함'}`;
      html += `<span class="cell${lv ? ' l' + lv : ''}${k === today ? ' today' : ''}" title="${tip}"></span>`;
    }
  }
  $('#heat').innerHTML = html;
}

// 날짜별 기록 (최근 14일치)
function renderDays() {
  $('#empty').hidden = log.length > 0;
  const groups = new Map();
  [...log].sort((a, b) => b.t - a.t).forEach(l => {
    const k = dayKey(l.t);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(l);
  });
  const name = id => (ex.find(e => e.id === id) || { animal: id }).animal;
  $('#days').innerHTML = [...groups.values()].slice(0, 14).map(items => {
    const d = new Date(items[0].t);
    const sum = items.reduce((a, l) => a + l.sec, 0);
    return `<div class="day">
      <h3>${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEKDAY[d.getDay()]}요일 <span>총 ${human(sum)}</span></h3>
      <ul>${items.map(l => {
        const t = new Date(l.t);
        return `<li><span class="time">${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}</span>
          <span>${esc(name(l.id))}</span><span>${human(l.sec)}</span>
          <span class="chip ${l.done ? 'done' : 'part'}">${l.done ? '완료' : '중단'}</span></li>`;
      }).join('')}</ul>
    </div>`;
  }).join('');
}

renderStats();
